const LOGO_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="WIDTH" viewBox="10 12 156 103" fill="none">

function escapeHTML(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

const _meas = document.createElement('canvas').getContext('2d');
function _w(text, weight, size) {
  _meas.font = `${weight} ${size}px Helvetica, Arial, sans-serif`;
  return _meas.measureText(text || '').width;
}
// If a person already has title + title2 in the JSON, respect their manual split.
// Otherwise, when title alone is too wide for the person column, split into title +
// title2 at the last word boundary that fits, and capitalise the first letter of
// the resulting 2nd line (e.g. "administrative" → "Administrative").
function autoSplitTitle(f) {
  const out = Object.assign({}, f);
  if (out.title2 && out.title2.trim()) return out; // manual split — leave alone
  const nameW  = _w(out.name,  '700', 16);
  const phoneW = out.phone ? _w(out.phone, '700', 13) : 0;
  const emailW = out.email ? _w(out.email, '700', 13) : 0;
  const maxW = Math.max(nameW, phoneW, emailW);
  const text = (out.title || '').replace(/\s+/g,' ').trim();
  if (!text) { out.title = ''; out.title2 = ''; return out; }
  if (_w(text, '400', 13) <= maxW) { out.title = text; out.title2 = ''; return out; }
  const words = text.split(' ');
  let line1 = '', i = 0;
  for (; i < words.length; i++) {
    const test = line1 ? line1 + ' ' + words[i] : words[i];
    if (_w(test, '400', 13) <= maxW || !line1) line1 = test; else break;
  }
  let line2 = words.slice(i).join(' ');
  if (line2) line2 = line2.charAt(0).toUpperCase() + line2.slice(1);
  out.title = line1;
  out.title2 = line2;
  return out;
}

function buildSignatureHTML(rawF) {
  const f = autoSplitTitle(rawF);
  const nameSize = 16, subSize = 13, contactSize = 13;
  const LH = 1.3;
  const lh = (s) => Math.round(s * LH);
  const colGap = 18;
  // hrBlockH calibrated so company total height = person total height (emails align).
  const hrBlockH = Math.max(1, 2 * lh(subSize) - lh(nameSize));
  const hrMarginV = Math.max(0, Math.round((hrBlockH - 1) / 2));
  const colH = lh(nameSize) + lh(subSize) * 2 + lh(contactSize) * 2;
  const logoH = colH;
  const logoW = Math.round(logoH * 156/103);

  const logoCell = `<td valign="top" style="padding:0 ${colGap}px 0 0;vertical-align:top">
    <div style="line-height:0;font-size:0">${LOGO_SVG.replace('WIDTH', logoW)}</div></td>`;

  const companyCell = `<td valign="top" style="padding:0 ${colGap}px 0 0;vertical-align:top;font-family:Helvetica,Arial,sans-serif;color:${GREEN}">
    <div style="font-weight:700;font-size:${nameSize}px;line-height:${LH};color:${GREEN};white-space:nowrap">${COMPANY.name}</div>
    <div style="font-weight:700;font-size:${nameSize}px;line-height:${LH};color:${GREEN};white-space:nowrap">${COMPANY.name2}</div>
    <div style="border-top:1px solid ${GREEN};margin:${hrMarginV}px 0;font-size:0;line-height:0">&nbsp;</div>
    <div style="font-weight:700;font-size:${contactSize}px;line-height:${LH};color:${GREEN};white-space:nowrap"><a href="tel:${COMPANY.phone.replace(/\s/g,'')}" style="color:${GREEN};text-decoration:none">${COMPANY.phone}</a></div>
    <div style="font-weight:700;font-size:${contactSize}px;line-height:${LH};color:${GREEN};white-space:nowrap"><a href="mailto:${COMPANY.email}" style="color:${GREEN};text-decoration:none">${COMPANY.email}</a></div></td>`;

  const sepCell = `<td valign="top" style="padding:0 ${colGap}px 0 0;vertical-align:top">
    <div style="width:1px;height:${colH}px;background:${GREEN};font-size:0;line-height:0">&nbsp;</div></td>`;

  const title1Filled = !!(f.title && f.title.trim());
  const title2Filled = !!(f.title2 && f.title2.trim());
  const personCell = `<td valign="top" style="vertical-align:top;font-family:Helvetica,Arial,sans-serif;color:#000000">
    <div style="font-weight:700;font-size:${nameSize}px;line-height:${LH};color:#000000;white-space:nowrap">${escapeHTML(f.name) || '&nbsp;'}</div>
    <div style="font-weight:400;font-size:${subSize}px;line-height:${LH};color:${title1Filled ? '#000000' : 'transparent'}">${title1Filled ? escapeHTML(f.title) : '&nbsp;'}</div>
    <div style="font-weight:400;font-size:${subSize}px;line-height:${LH};color:${title2Filled ? '#000000' : 'transparent'}">${title2Filled ? escapeHTML(f.title2) : '&nbsp;'}</div>
    ${f.phone ? `<div style="font-weight:700;font-size:${contactSize}px;line-height:${LH};color:#000000;white-space:nowrap"><a href="tel:${f.phone.replace(/\s/g,'')}" style="color:#000000;text-decoration:none">${escapeHTML(f.phone)}</a></div>` : ''}
    ${f.email ? `<div style="font-weight:700;font-size:${contactSize}px;line-height:${LH};color:#000000;white-space:nowrap"><a href="mailto:${f.email}" style="color:#000000;text-decoration:none">${escapeHTML(f.email)}</a></div>` : ''}</td>`;

  return `<table cellpadding="0" cellspacing="0" border="0" role="presentation" bgcolor="#ffffff" style="border-collapse:collapse;font-family:Helvetica,Arial,sans-serif;background-color:#ffffff;color-scheme:light only">
    <tr>${logoCell}${companyCell}${sepCell}${personCell}</tr></table>`;
}

function renderSig(p) {
  const sig = document.getElementById('sig');
  sig.innerHTML = buildSignatureHTML(p);
  return sig;
}

async function renderToPng(node) {
  const padX = 16, padY = 18;
  const w = Math.ceil(Math.max(node.scrollWidth, node.offsetWidth));
  const h = Math.ceil(Math.max(node.scrollHeight, node.offsetHeight));
  const totalW = w + padX*2, totalH = h + padY*2;
  const clone = node.cloneNode(true);
  const styleBlock = `<style>
    *{font-family:Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
    a{text-decoration:none}
  </style>`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${totalW}" height="${totalH}">
    <rect width="100%" height="100%" fill="#ffffff"/>
    <foreignObject x="${padX}" y="${padY}" width="${w}" height="${h+padY}">
      <div xmlns="http://www.w3.org/1999/xhtml">${styleBlock}${new XMLSerializer().serializeToString(clone)}</div>
    </foreignObject></svg>`;
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;});
  const scale = 4;
  const c = document.createElement('canvas');
  c.width = totalW*scale; c.height = totalH*scale;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,c.width,c.height);
  ctx.scale(scale,scale);
  ctx.drawImage(img,0,0);
  return c.toDataURL('image/png');
}

function slugify(s) {
  return s.toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}

function log(msg) {
  const div = document.createElement('div');
  div.className = 'row';
  div.textContent = msg;
  document.getElementById('log').appendChild(div);
}

async function runBatch() {
  let people;
  try {
    people = JSON.parse(document.getElementById('people').value);
  } catch(e) {
    log('Erreur JSON: ' + e.message);
    return;
  }
  log('Démarrage… (' + people.length + ' téléchargements)');
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  for (let i = 0; i < people.length; i++) {
    const p = people[i];
    const node = renderSig(p);
    await new Promise(r => setTimeout(r, 50));
    const dataURL = await renderToPng(node);
    const a = document.createElement('a');
    a.href = dataURL;
    a.download = `signature-${slugify(p.name)}.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    log(`✓ ${i+1}/${people.length} — ${p.name}`);
    await new Promise(r => setTimeout(r, 250));
  }
  log('Terminé. Vérifie ton dossier Téléchargements.');
}
</script>
